:root{

  --shadow:0 1px 2px rgba(15,30,45,.08),0 8px 24px rgba(15,30,45,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1219;--panel:#131b24;--ink:#e6edf3;--dim:#93a4b3;--line:#273441;--accent:#5fb0d9;--accent-ink:#06202e;--chip:#1a2430;
  --stage-a:#1a2632;--stage-b:#0a1016;--neutral:#33424f;--grid:#3b4e5e;--y25:#4f9ad0;--y26:#f0a23c;--ok:#5cc0a8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1219;--panel:#131b24;--ink:#e6edf3;--dim:#93a4b3;--line:#273441;--accent:#5fb0d9;--accent-ink:#06202e;--chip:#1a2430;
  --stage-a:#1a2632;--stage-b:#0a1016;--neutral:#33424f;--grid:#3b4e5e;--y25:#4f9ad0;--y26:#f0a23c;--ok:#5cc0a8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.top{display:flex;gap:16px;flex-wrap:wrap}
.brand{flex:1 1 250px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.brand h1{font-size:24px;line-height:1.15}
.kpis{flex:3 1 520px;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:11.5px;color:var(--dim)}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:12px}
:root{--c1:#16506e;--c2:#8fa3b6}
.stage{position:relative;min-height:700px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 30%,var(--stage-a),var(--stage-b));box-shadow:var(--shadow);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;font-size:10.5px;font-weight:600;color:#17232d;white-space:nowrap;text-shadow:0 0 3px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.9);will-change:transform}
.hl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:2px 7px;box-shadow:var(--shadow);will-change:transform;pointer-events:none}
.hl b{font-variant-numeric:tabular-nums}
.hl.on{border-color:var(--accent);outline:2px solid var(--accent)}
#fallback{position:absolute;inset:0;display:none;padding:12px}#fallback svg{width:100%;height:100%}#fallback path{stroke:var(--panel);stroke-width:1;cursor:pointer}
.hud{position:absolute;display:flex;gap:6px;flex-wrap:wrap}.hud.tl{top:10px;left:10px}.hud.tr{top:10px;right:10px;justify-content:flex-end}
.hud.bl{left:10px;bottom:10px}
.seg{display:inline-flex;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;backdrop-filter:blur(6px);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:700;color:var(--dim)}
.seg.sm button{padding:6px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.legend{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(6px)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;max-width:240px;opacity:0;z-index:5}
.panel{max-height:calc(100vh - 24px);position:sticky;top:12px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:var(--shadow)}
.body{padding:14px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px}
.body h2{font-size:19px}.body h3{font-size:15px}.sub{color:var(--dim);font-size:12.5px;margin:2px 0 0}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.card.sel{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.rrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1px solid transparent;background:var(--chip);border-radius:8px;padding:8px 10px;width:100%}
.rrow:hover{border-color:var(--line)}.rrow[aria-pressed="true"]{border-color:var(--accent)}
.rrow .bar{grid-column:1/3;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.rrow .bar i{display:block;height:100%}
.list{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:4px;padding:1px 6px;color:#fff;margin-right:6px}
.tag.o{background:var(--y25)}.tag.n{background:var(--y26);color:#1b1205}
.ln{font-size:12.5px;display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}.ln .c{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.chart3d{position:relative;height:250px;border-radius:10px;overflow:hidden;background:radial-gradient(110% 90% at 50% 25%,var(--stage-a),var(--stage-b));border:1px solid var(--line);touch-action:none}
.chart3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.cl{position:absolute;inset:0;pointer-events:none}.cl span{position:absolute;left:0;top:0;font-size:10px;font-weight:600;color:var(--dim);white-space:nowrap;will-change:transform}.cl span.on{color:var(--accent);font-weight:700}
.ct{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:11.5px;opacity:0;white-space:nowrap}
.zbar{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:10.5px;font-weight:700;color:#fff}
.zbar span{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.note{font-size:12.5px;background:var(--chip);border-radius:8px;padding:9px 11px}.note b{font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.tgroup{display:flex;flex-direction:column;gap:6px;min-width:0}.tgroup.grow{flex:1 1 260px}
.tlab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.seg.yr{background:var(--chip);backdrop-filter:none}
.seg.yr button{display:flex;flex-direction:column;align-items:flex-start;padding:7px 16px;line-height:1.2;text-align:left}
.seg.yr button b{font-size:16px;font-family:var(--f-display)}.seg.yr button small{font-size:11px;font-weight:500;opacity:.85}
#views{background:var(--chip);backdrop-filter:none}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;align-items:center;min-height:34px}
.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--dim);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:4px 8px;border-radius:6px}
.ptabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line)}

.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 8px;background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{border:1px solid var(--line);border-radius:10px;overflow:hidden}

.gh{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:var(--chip);padding:9px 12px;text-align:left}
.gh:hover{background:color-mix(in srgb,var(--accent) 10%,var(--chip))}
.gh .nm{font-weight:700}.gh .zn{font-size:11px;color:var(--dim);font-weight:500}
.cnts{display:flex;gap:4px;font-size:11.5px;font-weight:700;white-space:nowrap}
.cnts span{border-radius:999px;padding:2px 8px;color:#fff}.cnts .o{background:var(--y25)}.cnts .n{background:var(--y26);color:#1b1205}.cnts .z{background:var(--neutral);color:var(--ink)}
.pl{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline;padding:7px 12px;border-top:1px solid var(--line);font-size:12.5px}
.pr .c{grid-column:2;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.pr.empty{display:block;color:var(--dim)}
.tw{overflow-x:auto}tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent);font-weight:700}tr.tot td{font-weight:700;border-bottom:0}
.leftcol{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;box-shadow:var(--shadow);min-width:0}
.chartcard .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.chartcard h3{font-size:16px}
.chartcard .keys{display:flex;gap:14px;font-size:12px;color:var(--dim)}.chartcard .keys i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chartwrap{overflow-x:auto}.chartwrap svg{display:block}
.chartwrap .bar{cursor:pointer}
.stage{flex:1}
.zl{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-display);font-size:14px;font-weight:600;color:#14202b;text-shadow:0 0 4px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.95);pointer-events:none;will-change:transform;text-align:center;line-height:1.1}
.zl small{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:700;color:#3a4a57}
#fallback svg text{pointer-events:none}
#fallback .dp{stroke:#fff;stroke-width:1;cursor:pointer;transition:fill .3s,opacity .3s}
#fallback .dp:hover{opacity:.85}
#fallback .hub{cursor:pointer}
.lgd .zsw{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:6px}.lgd .zsw i{margin:0;width:10px}
.src{font-size:11px;color:var(--dim)}

  let h=`<div><h2>Proveedores ${S.y}</h2><p class="sub">${S.y===2026?'Red ampliada: los de 2025 más los nuevos incorporados en 2026.':'Red vigente en 2025: no incluye los proveedores marcados como «Nuevo».'} Toca una región para ubicarla en el mapa.</p></div>`;
  h+=`<div class="filters" role="group" aria-label="Año"><button class="chip" data-yy="2025" aria-pressed="${S.y===2025}">Proveedores 2025 · ${PROV.filter(p=>!p.new).length}</button><button class="chip" data-yy="2026" aria-pressed="${S.y===2026}">Proveedores 2026 · ${PROV.length}</button></div>`;
  if(S.zone)h+=`<div class="note" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${MZC[S.zone]};margin-right:6px"></i><b>Macrozona ${S.zone}</b> · ${zoneProv(S.zone)} proveedores en ${S.y}</span><button class="chip" data-clear="1">Ver todas</button></div>`;
  let keys=RK.slice().sort((a,b)=>cnt(b)-cnt(a)||cnt(b,2025)-cnt(a,2025));
  if(S.zone)keys=keys.filter(k=>REG[k].z===S.zone).concat(keys.filter(k=>REG[k].z!==S.zone));
  if(S.reg){keys.splice(keys.indexOf(S.reg),1);keys.unshift(S.reg)}
  h+='<div class="list">'+keys.map(k=>{
    const r=REG[k],ps=PROV.filter(p=>p.r===k&&inYear(p)).sort((a,b)=>a.new-b.new);
    const o=cnt(k,2025),n=S.y===2026?cntNew(k):0;
    const c=(o?`<span class="o">${o}</span>`:'')+(n?`<span class="n">+${n}</span>`:'')+(!o&&!n?'<span class="z">0</span>':'');
    return `<div class="grp${S.reg===k?' sel':''}" style="${S.zone&&S.zone!==r.z?'opacity:.55':''}"><button class="gh" data-reg="${k}" aria-pressed="${S.reg===k}"><span><span class="nm"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${MZC[r.z]};margin-right:6px"></i>${r.n}</span><br><span class="zn">Macrozona ${r.z} · compra local 2026: ${pct(r.l,0)}</span></span><span class="cnts">${c}</span></button><div class="pl">${ps.length?ps.map(provRow).join(''):`<div class="pr empty">${S.y===2025&&cntNew(k)?`Sin proveedores en 2025. En 2026 se abre con ${cntNew(k)}.`:'Sin proveedores.'}</div>`}</div></div>`;
  }).join('')+'</div>';
  return h;
}
function viewVenta(){
  let h=`<div><div class="row" style="justify-content:flex-start"><h2>Compra local por región</h2><span class="badge">DATOS 2026</span></div><p class="sub">Porcentaje de la venta de cada región abastecido con compra local en 2026, junto con sus proveedores por año. El gráfico sobre el mapa muestra el mismo dato.</p></div>`;
  const keys=RK.slice().sort((a,b)=>REG[b].l-REG[a].l||cnt(b,2026)-cnt(a,2026));
  h+=`<div class="card"><h3>Tabla 2026</h3><div class="tw"><table><tr><th>Región</th><th>Macrozona</th><th class="n">% compra local 2026</th><th class="n">Prov. 2025</th><th class="n">Prov. 2026</th></tr>${keys.map(k=>`<tr class="${S.reg===k?'sel':''}"><td><button style="border:0;background:none;padding:0;font-weight:600;text-align:left;text-decoration:underline dotted" data-reg="${k}">${REG[k].n}</button></td><td><span style="color:${MZC[REG[k].z]}">●</span> ${REG[k].z}</td><td class="n">${pct(REG[k].l,0)}</td><td class="n">${cnt(k,2025)}</td><td class="n">${cnt(k,2026)}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td></td><td></td><td class="n">${PROV.filter(p=>!p.new).length}</td><td class="n">${PROV.length}</td></tr></table></div></div>`;
  const o25=PROV.filter(p=>!p.new).length;
  h+=`<div class="note"><b>Lectura.</b> La red pasa de ${o25} a ${PROV.length} proveedores y de 3 a 5 macrozonas con proveedor, al sumar Pucallpa y Tarapoto (Oriente) y Huancayo (Centro). Arequipa recibe el mayor refuerzo (3 → 6). Iquitos tiene la mayor compra local (50%); Pucallpa y Tarapoto, la menor (20%), justo donde todos los proveedores son nuevos.</div>`;
  h+='<p class="src">Fuente: archivo «Datos provincia». El porcentaje de compra local corresponde a 2026. «2025» muestra los proveedores sin la marca «Nuevo».</p>';
  return h;
}
function viewPanel(){return S.pt==='prov'?viewProv():viewVenta()}
function render(){const b=$('#body'),k=b.scrollTop;b.innerHTML=viewPanel();b.scrollTop=S.keep?k:0;S.keep=false}
$('#body').addEventListener('click',e=>{const y=e.target.closest('[data-yy]');if(y){S.y=+y.dataset.yy;S.keep=true;sync();return}
  if(e.target.closest('[data-clear]')){S.zone=null;S.reg=null;focus();sync();return}
  const t=e.target.closest('[data-reg]');if(!t)return;const k=t.dataset.reg;if(S.reg===k){S.reg=null}else{S.reg=k;S.zone=REG[k].z}S.keep=S.pt==='venta';focus();sync()});
$('#ptabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.pt=b.dataset.pt;sync()});
function sync(){kp();stageUI();render();renderChart();targets()}
GL=false;S.map='2d';
fbBuild();applyMap();
sync();if(GL){setView('persp');cam.th=0;cam.ph=1.25;requestAnimationFrame(tick)}
new MutationObserver(()=>setTimeout(()=>{stageUI();render();renderChart();targets()},50)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(()=>{stageUI();render();targets()},50));
</script>
